<style>
        .scanline {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
        }
        .crt-flicker {
            animation: flicker 0.15s infinite;
        }
        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }
    </style>

<body class="bg-background text-on-surface font-body-md h-screen w-screen overflow-hidden flex flex-col antialiased selection:bg-primary selection:text-on-primary">
<!-- TopAppBar (Modified for Terminal state) -->
<header class="bg-surface dark:bg-surface border-b border-outline-variant flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full z-50 shrink-0">
<div class="font-headline-md text-headline-md font-bold tracking-tighter text-primary dark:text-primary uppercase">
            TETRA-OS v1.0 <span class="text-error text-sm ml-sm animate-pulse">[SYS_HALT]</span>
</div>
<div class="flex gap-md text-on-surface-variant items-center">
<span class="font-label-sm text-label-sm tracking-widest uppercase hidden md:inline-block">TERMINAL_CRITICAL</span>
</div>
</header>
<main class="flex-1 flex items-center justify-center relative z-10 scanline">
<!-- CRT Overlay -->
<div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_0%,rgba(0,0,0,0.4)_100%)]"></div>
<div class="w-full max-w-2xl px-margin-mobile md:px-0 relative crt-flicker">
<!-- System Error Container -->
<div class="bg-surface-container border border-outline-variant relative before:absolute before:inset-0 before:bg-surface-tint/5 before:pointer-events-none">
<!-- Error Header Tape -->
<div class="bg-error/10 border-b border-error/30 px-lg py-md flex items-center gap-md">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
<h1 class="font-headline-xl text-headline-xl text-error uppercase tracking-widest m-0">GAME OVER</h1>
</div>
<!-- Data Readout -->
<div class="p-lg md:p-xl space-y-xl">
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Score Block -->
<div class="bg-surface border border-outline-variant p-md flex flex-col justify-center items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-sm">FINAL SCORE</span>
<span class="font-headline-lg text-headline-lg text-primary font-bold">142,850</span>
</div>
<!-- Stats Block -->
<div class="flex flex-col gap-sm">
<!-- Lines -->
<div class="bg-surface border border-outline-variant p-md flex justify-between items-center">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">LINES CLEARED</span>
<span class="font-label-md text-label-md text-on-surface font-bold">114</span>
</div>
<!-- Level -->
<div class="bg-surface border border-outline-variant p-md flex justify-between items-center">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">LEVEL REACHED</span>
<span class="font-label-md text-label-md text-on-surface font-bold">12</span>
</div>
<!-- Duration -->
<div class="bg-surface border border-outline-variant p-md flex justify-between items-center">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">TIME ELAPSED</span>
<span class="font-label-md text-label-md text-on-surface font-bold">08:42:15</span>
</div>
</div>
</div>
<!-- Divider -->
<div class="h-px bg-outline-variant w-full relative">
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-surface-container px-sm font-label-sm text-label-sm text-outline uppercase tracking-widest">AWAITING INPUT</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col md:flex-row gap-md justify-center">
<button class="bg-primary text-surface font-label-md text-label-md uppercase px-xl py-md hover:bg-surface-tint transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container flex items-center justify-center gap-sm">
<span class="material-symbols-outlined">replay</span>
                            REBOOT SEQUENCE
                        </button>
<button class="bg-transparent border border-outline-variant text-on-surface font-label-md text-label-md uppercase px-xl py-md hover:border-primary hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container flex items-center justify-center gap-sm">
<span class="material-symbols-outlined">exit_to_app</span>
                            RETURN TO CORE
                        </button>
</div>
</div>
