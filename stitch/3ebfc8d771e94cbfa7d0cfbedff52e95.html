<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris Supervisor - Start</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                extend: {

                        "primary": "#8ed5ff",

                        "surface-tint": "#7bd0ff",

                        "on-surface": "#dae2fd",

                        "surface-bright": "#31394d",

                        "primary-container": "#38bdf8",

                        "on-tertiary-fixed": "#2a1700",

<style>
        .tetris-grid-bg {
            background-image: linear-gradient(to right, #1e293b 1px, transparent 1px), linear-gradient(to bottom, #1e293b 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.2;
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative">
<!-- Subtle Background Grid Overlay -->
<div class="absolute inset-0 tetris-grid-bg pointer-events-none z-0"></div>
<!-- Main Container -->
<main class="z-10 flex flex-col items-center gap-xl w-full max-w-2xl px-margin-mobile md:px-margin-desktop">
<!-- Header / Identity -->
<header class="text-center flex flex-col gap-sm">
<div class="flex items-center justify-center gap-sm mb-xs">
<span class="material-symbols-outlined text-primary text-headline-xl" style="font-size: 48px;">grid_view</span>
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tighter">TETRIS SUPERVISOR</h1>
</div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">System Boot Sequence V1.0</p>
</header>
<!-- Action Panel -->
<div class="bg-surface-container-low border border-outline-variant p-lg w-full flex flex-col gap-md shadow-2xl relative">
<!-- Decorative corners -->
<div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-primary"></div>
<div class="absolute top-0 right-0 w-2 h-2 border-t border-r border-primary"></div>
<div class="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-primary"></div>
<div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-primary"></div>
<div class="font-label-sm text-label-sm text-primary mb-xs flex justify-between border-b border-outline-variant pb-xs">
<span>&gt; AWAITING_INPUT</span>
<span>STATUS: ONLINE</span>
</div>
<!-- Primary Actions -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-md flex items-center justify-center gap-sm hover:bg-surface-tint transition-colors focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background border border-transparent hover:border-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                Start New Game
            </button>
<!-- Secondary Actions List -->
<div class="flex flex-col gap-sm mt-xs">
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-label-md text-label-md py-sm px-md flex items-center justify-between hover:border-primary hover:text-primary transition-colors focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background group">
<span class="flex items-center gap-sm">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">history</span>
                        Resume Session
                    </span>
<span class="text-on-surface-variant font-label-sm text-label-sm">[UNAVAILABLE]</span>
</button>
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-label-md text-label-md py-sm px-md flex items-center justify-between hover:border-primary hover:text-primary transition-colors focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background group">
<span class="flex items-center gap-sm">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">help_center</span>
                        Controls Help
                    </span>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</button>
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-label-md text-label-md py-sm px-md flex items-center justify-between hover:border-primary hover:text-primary transition-colors focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background group">
<span class="flex items-center gap-sm">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">settings</span>
                        System Settings
                    </span>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
</div>
<!-- Footer Info -->
<footer class="mt-auto md:mt-0 font-label-sm text-label-sm text-on-surface-variant text-center opacity-70">
<p>TERMINAL ID: 094-B // SECURE CONNECTION</p>
</footer>
</main>
</body></html>
