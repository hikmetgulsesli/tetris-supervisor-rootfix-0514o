<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface flex justify-between items-center px-margin-desktop h-16 w-full z-50 border-b border-outline-variant docked full-width top-0">
<div class="font-headline-md text-headline-md font-bold tracking-tighter text-primary dark:text-primary">
            TETRA-OS v1.0
        </div>
<div class="flex items-center gap-md">
<button class="text-on-surface-variant hover:bg-surface-container-highest transition-colors p-sm rounded focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="text-on-surface-variant hover:bg-surface-container-highest transition-colors p-sm rounded focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
<button class="text-primary font-bold hover:bg-surface-container-highest transition-colors p-sm rounded ring-2 ring-primary ring-offset-2 ring-offset-surface">
<span class="material-symbols-outlined" data-icon="pause">pause</span>
</button>
</div>
</header>
<div class="flex flex-1 overflow-hidden relative">
<!-- SideNavBar (Suppressed for Contextual Task) -->
<!-- The user is in a focused paused state relative to the game board, suppressing global nav -->
<!-- Main Content Area (Game Board Background) -->
<main class="flex-1 relative flex items-center justify-center p-margin-desktop">
<!-- Simulated Game Board (Dimmed) -->
<div class="absolute inset-0 grid-bg opacity-20 pointer-events-none"></div>
<div class="relative z-0 flex gap-gutter opacity-40 blur-[2px] transition-all duration-300">
<!-- Left Panel (Hold) -->
<div class="w-32 bg-surface-container border border-outline-variant flex flex-col items-center">
<div class="w-full bg-surface-container-high border-b border-outline-variant p-sm text-center">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">HOLD</span>
</div>
<div class="p-md h-32 flex items-center justify-center">
<div class="grid grid-cols-4 grid-rows-2 gap-[1px]">
<div class="w-6 h-6 bg-primary-container border inset-0 border-surface-container-lowest opacity-80"></div>
<div class="w-6 h-6 bg-primary-container border inset-0 border-surface-container-lowest opacity-80"></div>
<div class="w-6 h-6 bg-primary-container border inset-0 border-surface-container-lowest opacity-80"></div>
<div class="w-6 h-6 bg-primary-container border inset-0 border-surface-container-lowest opacity-80"></div>
</div>
</div>
</div>
<!-- Center Playfield -->
<div class="w-[320px] h-[640px] bg-surface-container-lowest border-2 border-outline-variant relative overflow-hidden">
<div class="absolute inset-0 grid-bg opacity-30"></div>
<!-- Simulated Blocks -->
<div class="absolute bottom-0 left-0 right-0 h-48 bg-surface-container-highest border-t border-outline-variant opacity-80 flex flex-wrap content-end">
<div class="w-8 h-8 bg-tertiary-container border inset-0 border-surface-container-lowest"></div>
<div class="w-8 h-8 bg-tertiary-container border inset-0 border-surface-container-lowest"></div>
<div class="w-8 h-8 bg-error border inset-0 border-surface-container-lowest"></div>
<div class="w-8 h-8 bg-primary-container border inset-0 border-surface-container-lowest"></div>
</div>
</div>
<!-- Right Panel (Next/Stats) -->
<div class="w-32 flex flex-col gap-gutter">
<div class="bg-surface-container border border-outline-variant flex flex-col items-center">
<div class="w-full bg-surface-container-high border-b border-outline-variant p-sm text-center">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">NEXT</span>
</div>
<div class="p-md h-32 flex items-center justify-center">
<div class="grid grid-cols-3 grid-rows-2 gap-[1px]">
<div class="col-start-2 w-6 h-6 bg-tertiary-container border inset-0 border-surface-container-lowest opacity-80"></div>
<div class="col-start-1 row-start-2 w-6 h-6 bg-tertiary-container border inset-0 border-surface-container-lowest opacity-80"></div>
<div class="col-start-2 row-start-2 w-6 h-6 bg-tertiary-container border inset-0 border-surface-container-lowest opacity-80"></div>

<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">SCORE</span>
</div>
<div class="p-md w-full text-right">
<span class="font-label-md text-label-md text-primary block mb-xs">014,520</span>
<span class="font-label-sm text-label-sm text-on-surface-variant block uppercase">LEVEL 04</span>
</div>
</div>
</div>

<div class="bg-surface-container border border-outline-variant p-xl flex flex-col items-center min-w-[400px]">
<h1 class="font-headline-xl text-headline-xl text-primary tracking-widest mb-lg uppercase">PAUSED</h1>
<div class="w-full h-px bg-outline-variant mb-xl"></div>
<div class="flex flex-col gap-md w-full">
<button class="w-full bg-primary-container text-on-primary-fixed font-label-md text-label-md py-md px-lg uppercase tracking-widest hover:bg-surface-tint transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
                            Resume Mission

                        </button>

<span class="material-symbols-outlined" data-icon="logout">logout</span>
                            Quit to Menu
                        </button>
</div>
</div>
</div>
